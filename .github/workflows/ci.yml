name: Native CAD contracts and bundles
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x64
          - runner: ubuntu-24.04-arm
            architecture: arm64
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
          - runner: windows-2025
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Bump for changes to SDK compiler/baseline/configure options. Recipe
      # changes are hashed separately; packaging/test edits do not change ABI.
      NATIVE_SDK_ABI: release-shared-xcode26.3-macos15-v1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Validate release identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw 'Tag must match VERSION' }
      - name: Select supported C++20 library on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
      - name: Linux packaging utilities and runtime notices
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libfontconfig1-dev
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          fi
          mkdir -p .deps/runtime-notices
          gcc_runtime_major=$(dpkg-query -W -f '${Version}' libstdc++6 | cut -d. -f1)
          cp "/usr/share/doc/gcc-${gcc_runtime_major}-base/copyright" .deps/runtime-notices/GCC-runtime-copyright
          cp /usr/share/common-licenses/GPL-3 .deps/runtime-notices/GPL-3
          cp /usr/share/doc/libfontconfig1/copyright .deps/runtime-notices/Fontconfig-copyright
          cp /usr/share/doc/libexpat1/copyright .deps/runtime-notices/Expat-copyright
          dpkg-query -W -f '${binary:Package}\t${Version}\n' libfontconfig1 libexpat1 libstdc++6 libgcc-s1 > .deps/runtime-notices/Linux-runtime-packages.txt
      - uses: actions/cache/restore@v4
        id: native-deps
        with:
          path: .deps/native
          key: native-${{ matrix.runner }}-${{ matrix.architecture }}-${{ env.NATIVE_SDK_ABI }}-${{ hashFiles('cmake/dependencies/**') }}
          # Migrate only the four verified initial SDK caches, with the exact
          # unchanged recipe and ABI. No broad or cross-platform fallback.
          restore-keys: ${{ env.NATIVE_SDK_ABI == 'release-shared-xcode26.3-macos15-v1' && hashFiles('cmake/dependencies/**') == '6a2eb1af8d147a2692aac7f148fbf0373d7953f0e174c39e21e78c2b817e8bbd' && format('native-{0}-{1}-occt8.0.1-ft2.14.3-6aae39f8f9f0614ba2044fe991082fcc247c95ed25e033997eaa97bc0fb6a940', matrix.runner, matrix.architecture) || '' }}
      - name: Build checksum-pinned native dependencies
        if: steps.native-deps.outputs.cache-matched-key == ''
        run: |
          $prefix = Join-Path $PWD '.deps/native'
          cmake -S cmake/dependencies -B build-deps "-DAGENTCAD_DEPS_PREFIX=$prefix" -DAGENTCAD_JOBS=3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-deps --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Save only a successful SDK, before service tests or packaging can fail.
      - name: Retain completed native SDK
        if: steps.native-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/native
          key: ${{ steps.native-deps.outputs.cache-primary-key }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure service
        run: |
          $prefix = Join-Path $PWD '.deps/native'
          $options = @('-DCMAKE_BUILD_TYPE=Release', "-DOpenCASCADE_DIR=$prefix/lib/cmake/opencascade", "-DCMAKE_PREFIX_PATH=$prefix")
          if ($IsLinux) {
            $notices = Join-Path $PWD '.deps/runtime-notices'
            $options += "-DAGENTCAD_EXTRA_NOTICE_FILES=$notices/GCC-runtime-copyright;$notices/GPL-3;$notices/Fontconfig-copyright;$notices/Expat-copyright;$notices/Linux-runtime-packages.txt"
          }
          cmake -S . -B build @options
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and test real geometry, persistence and workers
        run: |
          cmake --build build --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($IsWindows) { $env:PATH = "$(Join-Path $PWD '.deps/native/bin');$env:PATH" }
          $env:AGENTCAD_GEOMETRY_EVIDENCE_DIR = Join-Path $PWD 'build/geometry-evidence'
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate schemas and official MCP SDK interoperability (developer tests only)
        run: |
          python -m pip install -r tests/mcp_sdk_requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/mcp_sdk_deadline_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/universal_runtime_contract_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Join-Path $PWD 'build/agent-3d-cad'
          if ($IsWindows) {
            $exe = Join-Path $PWD 'build/Release/agent-3d-cad.exe'
            $env:PATH = "$(Join-Path $PWD '.deps/native/bin');$env:PATH"
          }
          $fixture = Join-Path (Split-Path $exe) 'cad_slicer_fixture'
          if ($IsWindows) { $fixture += '.exe' }
          python tests/schema_conformance.py $exe $fixture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/mcp_sdk_smoke.py $exe $fixture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Exercise every modeling family through actual discovered contracts
          # on the same native platform as its geometry and persistence tests.
          $modelSchemaChecks = @(
            'modeling_gap_schema_tests.py',
            'authoring_schema_tests.py',
            'parity_solids_schema_tests.py',
            'parity_sheet_schema_tests.py',
            'parity_surfaces_schema_tests.py',
            'parity_curves_schema_tests.py',
            'parity_curve_completion_schema_tests.py',
            'parity_authoring_schema_tests.py',
            'mesh_reconstruction_schema_tests.py'
          )
          foreach ($check in $modelSchemaChecks) {
            python (Join-Path 'tests' $check) $exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python tests/artifact_mcp_sdk_smoke.py $exe (Join-Path $PWD 'build/artifact-sdk-evidence.json')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/artifact_schema_tests.py (Join-Path $PWD 'build/artifact-flow-evidence.json')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/robot_export_test.py $exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installer and client configuration checks
        run: |
          $exe = Join-Path $PWD 'build/agent-3d-cad'
          if ($IsWindows) {
            $exe = Join-Path $PWD 'build/Release/agent-3d-cad.exe'
            $env:PATH = "$(Join-Path $PWD '.deps/native/bin');$env:PATH"
            ./tests/install_windows_test.ps1
          } else {
            python tests/download_installer_test.py
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python tests/client_config_test.py $exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/package_architecture_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/source_identity_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/universal_validation_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($IsMacOS) {
            python tests/universal_composer_tests.py
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python tests/packaging_provenance_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/linux_staging_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Relocated bundle without SDK environment
        run: |
          $build = Join-Path $PWD 'build'
          $smoke = Join-Path $PWD 'build/bundle-smoke'
          cmake "-DBUILD_DIR=$build" "-DTEST_DIR=$smoke" -P tests/bundle_smoke.cmake
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bundle = Join-Path $PWD 'bundle'
          cmake --install build --config Release --prefix $bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Fresh Linux runtime container, with no development tools
        if: runner.os == 'Linux'
        shell: bash
        run: docker build --file packaging/Dockerfile.runtime-test --tag agentcad-runtime-test .
      - name: Create native preview archive
        run: |
          cpack --config build/CPackConfig.cmake -C Release -B build/packages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain verified thin macOS core for one universal composition
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-input-${{ matrix.architecture }}
          path: build/packages/agent-3d-cad-*-Darwin-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Package and test native ChatGPT plugin (no standalone app)
        run: |
          python tests/package_documentation_test.py bundle .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python packaging/make-plugin.py bundle build/plugins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $plugin = Get-ChildItem build/plugins -Directory | Select-Object -First 1
          python tests/plugin_smoke.py $plugin.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lifecycleArgs = @($plugin.FullName)
          if (-not $IsLinux) {
            $version = (Get-Content VERSION -Raw).Trim()
            $system = if ($IsMacOS) { 'Darwin' } else { 'Windows' }
            python packaging/make-mcpb.py bundle "build/plugins/agent-cad-claude-$version-$system-${{ matrix.architecture }}.mcpb"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $lifecycleArgs += "build/plugins/agent-cad-claude-$version-$system-${{ matrix.architecture }}.mcpb"
          }
          python tests/package_lifecycle_test.py @lifecycleArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: agent-cad-plugins-${{ matrix.runner }}-${{ matrix.architecture }}
          path: |
            build/plugins/*.zip
            build/plugins/*.mcpb
          if-no-files-found: error
          retention-days: 14
      # Retain the old preview asset contract. Plugin development and 1.0 do
      # not need Rust, a standalone app or GUI build dependencies.
      - name: Build legacy standalone viewer for 0.x preview tags
        if: startsWith(github.ref, 'refs/tags/v0.')
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CAD_SERVICE_EXE = Join-Path $PWD 'bundle/bin/agent-3d-cad'
          if ($IsWindows) { $env:CAD_SERVICE_EXE += '.exe' }
          cargo +1.95.0 test --locked --manifest-path desktop/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 build --locked --release --manifest-path desktop/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $viewer = 'desktop/target/release/agent-cad-viewer'
          if ($IsWindows) { $viewer += '.exe' }
          python packaging/package-desktop.py bundle build/packages $viewer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $IsLinux) {
            $version = (Get-Content VERSION -Raw).Trim()
            $system = if ($IsMacOS) { 'Darwin' } else { 'Windows' }
            python packaging/make-mcpb.py bundle "build/packages/agent-3d-cad-$version-$system-${{ matrix.architecture }}.mcpb"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: native-preview-${{ matrix.runner }}-${{ matrix.architecture }}
          path: |
            build/packages/*.tar.gz
            build/packages/*.zip
            build/packages/*.mcpb
          if-no-files-found: error
          # CI previews expire; versioned release downloads are retained separately.
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-evidence-${{ matrix.runner }}-${{ matrix.architecture }}
          retention-days: 14
          path: |
            build/Testing/Temporary/LastTest.log
            build/geometry-evidence/**
            build-deps/**/CMakeConfigureLog.yaml

  macos-universal-compose:
    # Compose exactly once from this run's verified, source-stamped thin cores.
    # No thin core is rebuilt or selected by an end user's host application.
    needs: native
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal-input-arm64
          path: universal-inputs/arm64
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal-input-x64
          path: universal-inputs/x64
      - name: Compose and package one universal native engine
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          mkdir -p universal-thin/arm64 universal-thin/x64 universal-build published
          tar -xzf "universal-inputs/arm64/agent-3d-cad-$version-Darwin-arm64.tar.gz" -C universal-thin/arm64
          tar -xzf "universal-inputs/x64/agent-3d-cad-$version-Darwin-x64.tar.gz" -C universal-thin/x64
          universal="agent-3d-cad-$version-Darwin-universal"
          python packaging/compose-macos-universal.py \
            "universal-thin/arm64/agent-3d-cad-$version-Darwin-arm64" \
            "universal-thin/x64/agent-3d-cad-$version-Darwin-x64" "universal-build/$universal"
          cmake "-DSOURCE_ROOT=$PWD" "-DOUTPUT_MANIFEST=$PWD/published/source-inputs.sha256" -P cmake/SourceIdentity.cmake
          python tests/package_documentation_test.py "universal-build/$universal" .
          (cd universal-build && cmake -E tar czf "../published/$universal.tar.gz" --format=gnutar "$universal")
          python packaging/make-plugin.py "universal-build/$universal" published
          python packaging/make-mcpb.py "universal-build/$universal" "published/agent-cad-claude-$version-Darwin-universal.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-packages
          path: |
            published/*.tar.gz
            published/*.zip
            published/*.mcpb
            published/source-inputs.sha256
          if-no-files-found: error
          retention-days: 14

  macos-universal-runtime:
    needs: macos-universal-compose
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Fresh runners download the SAME artifact; no build/SDK/cache setup here.
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal-packages
          path: universal-packages
      - name: Run relocated native and both plugin packages on the actual CPU
        env:
          TEST_SOURCE_COMMIT: ${{ github.sha }}
          TEST_NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python tests/universal_package_runtime.py run --packages universal-packages \
            --architecture "$TEST_NATIVE_ARCHITECTURE" --source "$TEST_SOURCE_COMMIT" \
            --report "universal-runtime-$TEST_NATIVE_ARCHITECTURE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-universal-runtime-${{ matrix.architecture }}
          path: universal-runtime-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 14

  macos-universal-acceptance:
    needs: macos-universal-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-universal-runtime-*
          path: universal-evidence
          merge-multiple: true
      - name: Require same archive bytes and actual native processes on both CPUs
        env:
          TEST_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 tests/universal_package_runtime.py compare \
            universal-evidence/universal-runtime-arm64.json universal-evidence/universal-runtime-x64.json \
            --source "$TEST_SOURCE_COMMIT" --report universal-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-acceptance
          path: universal-acceptance.json
          retention-days: 14

  release:
    # 1.0 publication needs actual two-host acceptance, not just a green build.
    if: startsWith(github.ref, 'refs/tags/v0.')
    needs: [native, macos-universal-acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-preview-*
          path: release
          merge-multiple: true
      - name: Prepare checksums and release notes
        run: |
          cp install.sh install.ps1 release/
          python3 packaging/release-manifest.py release
      - name: Create draft release after native and universal runtime gates pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "Agent CAD $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
