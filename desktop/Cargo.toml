[package]
name = "agent-cad-viewer"
version = "0.1.0-preview.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Standalone Tauri viewer for agent-3d-cad"

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = "=2.12.1"
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
